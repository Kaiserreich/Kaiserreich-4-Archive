l_simp_chinese:
  submarine: "潜艇"
  submarine_desc: "潜艇是隐蔽的袭击舰船。重型潜艇体型更大、火力更强、航程更远，并具备一定的水面对舰与岸上轰击能力。"
  light_cruiser: "轻巡洋舰"
  light_cruiser_desc: "轻型掩护舰，主要职责是保护主力舰队免受轻型敌舰攻击，并可发射鱼雷对大舰造成威胁。"
  carrier: "航空母舰"
  carrier_desc: "能够携带强大舰载机群投入战斗的主力舰，同时可作为海上浮动机场用于对岸作战投送。"

  EQUIPMENT_DESIGNER_DESC: "设计者： $DESIGNER|Y$"
  EQUIPMENT_ARMOR: "装甲"
  EQUIPMENT_MOTORIZED: "卡车"
  EQUIPMENT_MECHANIZED: "机械化"

  light_tank_equipment: "轻型坦克"
  light_tank_equipment_desc: "轻型坦克机动性高，适合侦察与对付轻装甲目标。"
  medium_tank_equipment: "中型坦克"
  medium_tank_equipment_desc: "中型坦克是多用途车辆，适用于支援步兵、与敌方坦克交战等多种任务。"
