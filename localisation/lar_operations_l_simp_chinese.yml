l_simp_chinese:
  operation_boost_resistance: "加强抵抗运动"
  operation_boost_resistance_desc: "§L敌占区的游击队急需支援以继续斗争。他们牵制了大量敌军，若给与支援可以进一步削弱敌军战力。§!"
  operation_capture_cipher: "夺取密码本"
  operation_capture_cipher_desc: "§L夺取或获取敌方密码本将为我们的破译人员带来决定性优势。§!"
  infiltration_paradrop: "伞降渗透"
  infiltration_paradrop_desc: "特工将以伞降方式投送至目标区域。低空夜间飞行可避免敌方战斗机的干扰。"
  exfiltration_air_pickup: "空中接应"
  exfiltration_air_pickup_desc: "一架飞机将夜间进入敌方领土，在标记的场地着陆并接走我们的特工。"
